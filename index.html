<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="交易日誌" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>交易日誌</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--bg3:#e8e8e8;
  --text:#111111;--text2:#666666;--text3:#999999;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --success:#1a7a3f;--danger:#c0392b;--warning:#9a6200;
  --bg-success:#eaf5ee;--bg-danger:#fdecea;--bg-warning:#fff8e6;
  --radius:8px;--radius-lg:12px
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#252525;--bg3:#303030;
    --text:#f0f0f0;--text2:#aaaaaa;--text3:#555555;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
    --success:#4caf82;--danger:#e57373;--warning:#ffb74d;
    --bg-success:#1a3a28;--bg-danger:#3a1a1a;--bg-warning:#3a2e10
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:680px;margin:0 auto}
.header{padding:16px 20px 0;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.header h1{font-size:15px;font-weight:600;margin-bottom:12px;letter-spacing:0.05em}
.tabs{display:flex}
.tab{flex:1;padding:9px 4px;font-size:13px;cursor:pointer;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-0.5px;font-family:inherit}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.content{flex:1;padding:20px;overflow-y:auto}
.panel{display:none}.panel.active{display:block}
.slabel{font-size:11px;color:var(--text2);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.ig{display:flex;flex-direction:column;gap:5px}
.ig label{font-size:12px;color:var(--text2)}
.ig input,.ig select,.ig textarea{width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none}
.ig input:focus,.ig select:focus,.ig textarea:focus{border-color:var(--text2)}
.ig textarea{height:70px;resize:vertical}
.divider{border:none;border-top:0.5px solid var(--border);margin:16px 0}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.metric{background:var(--bg2);border-radius:var(--radius);padding:10px 12px}
.metric .ml{font-size:11px;color:var(--text2);margin-bottom:3px}
.metric .mv{font-size:16px;font-weight:600}
.pos{color:var(--success)}.neg{color:var(--danger)}.warn{color:var(--warning)}
.rr-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.rr-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.rr-card .rl{font-size:11px;color:var(--text2);margin-bottom:3px}
.rr-card .rv{font-size:14px;font-weight:600;margin-bottom:2px}
.rr-card .rp{font-size:12px;color:var(--success)}
.warn-box{background:var(--bg-warning);border:0.5px solid var(--warning);border-radius:var(--radius);padding:9px 12px;font-size:12px;color:var(--warning);margin-bottom:12px;display:none}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2)}
.chip.selected{background:var(--bg3);color:var(--text);border-color:var(--text2);font-weight:500}
.btn{width:100%;padding:11px;font-size:14px;font-weight:500;cursor:pointer;border-radius:var(--radius);background:var(--bg2);border:0.5px solid var(--border2);color:var(--text);margin-top:8px;font-family:inherit}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.trade-item{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px;background:var(--bg)}
.trade-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.trade-symbol{font-weight:600;font-size:15px}
.trade-pnl{font-size:16px;font-weight:600}
.trade-meta{font-size:12px;color:var(--text2);margin-bottom:5px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg2);color:var(--text2)}
.dir-tag{font-size:11px;padding:2px 8px;border-radius:10px}
.dir-long{background:var(--bg-success);color:var(--success)}
.dir-short{background:var(--bg-danger);color:var(--danger)}
.del-btn{font-size:11px;color:var(--text3);cursor:pointer;background:none;border:none;padding:2px 6px;font-family:inherit}
.del-btn:hover{color:var(--danger)}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:13px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--bg2);border-radius:var(--radius);padding:12px}
.stat .sl{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat .sv{font-size:20px;font-weight:600}
.img-upload-area{border:0.5px dashed var(--border2);border-radius:var(--radius);padding:18px;text-align:center;cursor:pointer;color:var(--text2);font-size:13px;margin-bottom:10px;position:relative}
.img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-preview{width:100%;border-radius:var(--radius);margin-top:8px;max-height:200px;object-fit:cover;display:none}
.img-url-row{display:flex;gap:8px;margin-bottom:8px}
.img-url-row input{flex:1;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.img-url-row button{padding:0 14px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;font-size:13px;white-space:nowrap;font-family:inherit}
.img-clear{font-size:12px;color:var(--danger);cursor:pointer;background:none;border:none;padding:4px 0;display:none;font-family:inherit}
.trade-img{width:100%;border-radius:var(--radius);margin-top:8px;max-height:180px;object-fit:cover;cursor:pointer}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-overlay img{max-width:95%;max-height:90vh;border-radius:var(--radius);object-fit:contain}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:9px 18px;font-size:13px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:300;white-space:nowrap}
.bar-bg{background:var(--bg2);border-radius:4px;height:6px;overflow:hidden;margin:4px 0 10px}
.bar-fill{height:100%;border-radius:4px;background:var(--text2);opacity:0.4}
.note-text{font-size:12px;color:var(--text2);margin-top:6px;font-style:italic}
@media(max-width:400px){
  .metric-grid,.stat-grid{grid-template-columns:repeat(2,1fr)}
  .row3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>交易系統</h1>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('calc')">計算器</button>
      <button class="tab" onclick="switchTab('log')">新增</button>
      <button class="tab" onclick="switchTab('history')">歷史</button>
      <button class="tab" onclick="switchTab('stats')">統計</button>
    </div>
  </div>
  <div class="content">

    <!-- CALC -->
    <div class="panel active" id="panel-calc">
      <p class="slabel">帳戶設定</p>
      <div class="row2">
        <div class="ig"><label>帳戶餘額 (U)</label><input type="number" id="c_balance" value="1152.19" step="0.01" oninput="calcUpdate()" /></div>
        <div class="ig"><label>槓桿</label><input type="number" id="c_leverage" value="100" step="1" oninput="calcUpdate()" /></div>
      </div>
      <div class="row2">
        <div class="ig"><label>每日目標 (U)</label><input type="number" id="c_target" value="100" oninput="calcUpdate()" /></div>
        <div class="ig"><label>每日最大虧損 (U)</label><input type="number" id="c_maxloss" value="70" oninput="calcUpdate()" /></div>
      </div>
      <hr class="divider" />
      <p class="slabel">這筆單</p>
      <div class="row3">
        <div class="ig"><label>保證金 (%)</label><input type="number" id="c_margin" value="7" step="0.5" oninput="calcUpdate()" /></div>
        <div class="ig"><label>方向</label><select id="c_dir" onchange="calcUpdate()"><option value="long">做多</option><option value="short">做空</option></select></div>
        <div class="ig"><label>進場價</label><input type="number" id="c_entry" value="1800" step="0.01" oninput="calcUpdate()" /></div>
      </div>
      <div class="row2">
        <div class="ig"><label>止損價</label><input type="number" id="c_sl" value="1785" step="0.01" oninput="calcUpdate()" /></div>
        <div class="ig"><label>止盈價（選填）</label><input type="number" id="c_tp" placeholder="自動計算" step="0.01" oninput="calcUpdate()" /></div>
      </div>
      <div class="warn-box" id="c_warn">⚠ 這筆風險超過每日最大虧損上限</div>
      <div class="metric-grid">
        <div class="metric"><div class="ml">保證金</div><div class="mv" id="cm_margin">—</div></div>
        <div class="metric"><div class="ml">控倉規模</div><div class="mv" id="cm_size">—</div></div>
        <div class="metric"><div class="ml">止損距離</div><div class="mv" id="cm_slpct">—</div></div>
        <div class="metric"><div class="ml">風險 (U)</div><div class="mv" id="cm_risk">—</div></div>
        <div class="metric"><div class="ml">佔日止損</div><div class="mv" id="cm_dpct">—</div></div>
        <div class="metric"><div class="ml">爆倉距離</div><div class="mv" id="cm_liq">—</div></div>
      </div>
      <p class="slabel">止盈目標</p>
      <div class="rr-row" id="cm_rr"></div>
    </div>

    <!-- LOG -->
    <div class="panel" id="panel-log">
      <p class="slabel">基本資訊</p>
      <div class="row3">
        <div class="ig"><label>日期</label><input type="date" id="l_date" /></div>
        <div class="ig"><label>幣種</label><input type="text" id="l_symbol" value="ETH" /></div>
        <div class="ig"><label>方向</label><select id="l_dir"><option value="long">做多</option><option value="short">做空</option></select></div>
      </div>
      <div class="row3">
        <div class="ig"><label>進場價</label><input type="number" id="l_entry" step="0.01" /></div>
        <div class="ig"><label>止損價</label><input type="number" id="l_sl" step="0.01" /></div>
        <div class="ig"><label>止盈價</label><input type="number" id="l_tp" step="0.01" /></div>
      </div>
      <div class="row2">
        <div class="ig"><label>盈虧 (U)，虧損填負數</label><input type="number" id="l_pnl" step="0.01" placeholder="+45.5 或 -30" /></div>
        <div class="ig"><label>結果</label><select id="l_outcome"><option value="win">獲利</option><option value="loss">虧損</option><option value="be">保本</option></select></div>
      </div>
      <hr class="divider" />
      <p class="slabel">進場理由（可複選）</p>
      <div class="chip-row" id="reason_chips">
        <div class="chip" onclick="toggleChip(this,'重疊K')">重疊K</div>
        <div class="chip" onclick="toggleChip(this,'真空區')">真空區</div>
        <div class="chip" onclick="toggleChip(this,'POC止盈')">POC止盈</div>
        <div class="chip" onclick="toggleChip(this,'日開')">日開</div>
        <div class="chip" onclick="toggleChip(this,'四小開')">四小開</div>
        <div class="chip" onclick="toggleChip(this,'結構支撐')">結構支撐</div>
        <div class="chip" onclick="toggleChip(this,'結構壓力')">結構壓力</div>
      </div>
      <hr class="divider" />
      <p class="slabel">情緒狀態</p>
      <div class="chip-row" id="emotion_chips">
        <div class="chip" onclick="toggleSingle(this,'emotion_chips')">冷靜</div>
        <div class="chip" onclick="toggleSingle(this,'emotion_chips')">急躁</div>
        <div class="chip" onclick="toggleSingle(this,'emotion_chips')">FOMO</div>
        <div class="chip" onclick="toggleSingle(this,'emotion_chips')">報復</div>
        <div class="chip" onclick="toggleSingle(this,'emotion_chips')">猶豫</div>
      </div>
      <hr class="divider" />
      <p class="slabel">圖表截圖</p>
      <div class="img-upload-area" id="upload_area">
        <input type="file" accept="image/*" onchange="handleFileUpload(event)" />
        點擊或拖曳上傳截圖
      </div>
      <img id="img_preview" class="img-preview" alt="預覽" />
      <button class="img-clear" id="img_clear_btn" onclick="clearImage()">清除圖片</button>
      <div style="margin:10px 0 5px;font-size:12px;color:var(--text2)">或貼上圖片網址</div>
      <div class="img-url-row">
        <input type="text" id="img_url_input" placeholder="https://i.imgur.com/..." />
        <button onclick="applyImgUrl()">套用</button>
      </div>
      <hr class="divider" />
      <div class="ig"><label>備註</label><textarea id="l_note" placeholder="這筆哪裡做對了？哪裡可以更好？"></textarea></div>
      <button class="btn primary" onclick="saveTrade()">儲存這筆紀錄</button>
    </div>

    <!-- HISTORY -->
    <div class="panel" id="panel-history">
      <div id="history_list"><div class="empty">載入中...</div></div>
    </div>

    <!-- STATS -->
    <div class="panel" id="panel-stats">
      <div id="stats_content"><div class="empty">載入中...</div></div>
    </div>

  </div>
</div>

<div class="modal-overlay" id="img_modal" onclick="closeModal()">
  <img id="modal_img" src="" alt="放大圖" />
</div>
<div class="toast" id="toast"></div>

<script>
let trades=[];
let selectedReasons=[];
let selectedEmotion='';
let currentImgData='';

function switchTab(name){
  const names=['calc','log','history','stats'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',names[i]===name));
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',names[i]===name));
  if(name==='history')renderHistory();
  if(name==='stats')renderStats();
  if(name==='log')document.getElementById('l_date').value=new Date().toISOString().split('T')[0];
}

function toggleChip(el,val){
  el.classList.toggle('selected');
  if(el.classList.contains('selected')){if(!selectedReasons.includes(val))selectedReasons.push(val);}
  else selectedReasons=selectedReasons.filter(r=>r!==val);
}

function toggleSingle(el,gid){
  document.querySelectorAll('#'+gid+' .chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  selectedEmotion=el.textContent;
}

function handleFileUpload(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{currentImgData=ev.target.result;showPreview(currentImgData);};
  reader.readAsDataURL(file);
}

function applyImgUrl(){
  const url=document.getElementById('img_url_input').value.trim();
  if(!url)return;
  currentImgData=url;
  showPreview(url);
}

function showPreview(src){
  const prev=document.getElementById('img_preview');
  prev.src=src;prev.style.display='block';
  document.getElementById('img_clear_btn').style.display='block';
  document.getElementById('upload_area').style.display='none';
}

function clearImage(){
  currentImgData='';
  const prev=document.getElementById('img_preview');
  prev.src='';prev.style.display='none';
  document.getElementById('img_clear_btn').style.display='none';
  document.getElementById('upload_area').style.display='block';
  document.getElementById('img_url_input').value='';
}

function openModal(src){document.getElementById('modal_img').src=src;document.getElementById('img_modal').classList.add('open');}
function closeModal(){document.getElementById('img_modal').classList.remove('open');}

function calcUpdate(){
  const balance=parseFloat(document.getElementById('c_balance').value)||0;
  const leverage=parseFloat(document.getElementById('c_leverage').value)||1;
  const maxloss=parseFloat(document.getElementById('c_maxloss').value)||0;
  const margin_pct=parseFloat(document.getElementById('c_margin').value)||0;
  const dir=document.getElementById('c_dir').value;
  const entry=parseFloat(document.getElementById('c_entry').value)||0;
  const sl=parseFloat(document.getElementById('c_sl').value)||0;
  if(!entry||!sl)return;
  const margin=balance*(margin_pct/100);
  const size=margin*leverage;
  const qty=size/entry;
  const sl_dist=Math.abs(entry-sl);
  const sl_pct=(sl_dist/entry)*100;
  const risk_u=qty*sl_dist;
  const liq_price=dir==='long'?entry*(1-1/leverage):entry*(1+1/leverage);
  const daily_pct=maxloss>0?(risk_u/maxloss)*100:0;
  document.getElementById('cm_margin').textContent=margin.toFixed(2)+' U';
  document.getElementById('cm_size').textContent=size.toFixed(0)+' U';
  document.getElementById('cm_slpct').textContent=sl_pct.toFixed(2)+'%';
  const rm=document.getElementById('cm_risk');
  rm.textContent=risk_u.toFixed(2)+' U';
  rm.className='mv '+(risk_u>maxloss?'neg':risk_u>maxloss*0.6?'warn':'');
  const dm=document.getElementById('cm_dpct');
  dm.textContent=daily_pct.toFixed(1)+'%';
  dm.className='mv '+(daily_pct>100?'neg':daily_pct>70?'warn':'pos');
  document.getElementById('cm_liq').textContent=liq_price.toFixed(2);
  document.getElementById('c_warn').style.display=risk_u>maxloss?'block':'none';
  const rr_row=document.getElementById('cm_rr');
  rr_row.innerHTML='';
  [1.5,2,3].forEach(rr=>{
    const tp_dist=sl_dist*rr;
    const tp_price=dir==='long'?entry+tp_dist:entry-tp_dist;
    const tp_u=qty*tp_dist;
    rr_row.innerHTML+=`<div class="rr-card"><div class="rl">1 : ${rr}</div><div class="rv">${tp_price.toFixed(2)}</div><div class="rp">+${tp_u.toFixed(2)} U</div></div>`;
  });
}

function loadTrades(){
  try{trades=JSON.parse(localStorage.getItem('trades_v3')||'[]');}
  catch(e){trades=[];}
}

function persistTrades(){
  try{localStorage.setItem('trades_v3',JSON.stringify(trades));return true;}
  catch(e){return false;}
}

function saveTrade(){
  const pnl=parseFloat(document.getElementById('l_pnl').value);
  const entry=parseFloat(document.getElementById('l_entry').value);
  if(!entry||isNaN(pnl)){showToast('請填寫進場價和盈虧U數');return;}
  const trade={
    id:Date.now(),
    date:document.getElementById('l_date').value,
    symbol:document.getElementById('l_symbol').value||'ETH',
    dir:document.getElementById('l_dir').value,
    entry,sl:parseFloat(document.getElementById('l_sl').value)||null,
    tp:parseFloat(document.getElementById('l_tp').value)||null,
    pnl,outcome:document.getElementById('l_outcome').value,
    reasons:[...selectedReasons],emotion:selectedEmotion,
    note:document.getElementById('l_note').value,
    img:currentImgData
  };
  trades.unshift(trade);
  if(!persistTrades()){
    trade.img='';
    persistTrades();
    showToast('圖片太大已略過，其餘已儲存');
  }else{showToast('已儲存');}
  document.getElementById('l_entry').value='';
  document.getElementById('l_sl').value='';
  document.getElementById('l_tp').value='';
  document.getElementById('l_pnl').value='';
  document.getElementById('l_note').value='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  selectedReasons=[];selectedEmotion='';
  clearImage();
}

function deleteTrade(id){
  if(!confirm('確定刪除這筆紀錄？'))return;
  trades=trades.filter(t=>t.id!==id);
  persistTrades();renderHistory();renderStats();
}

function renderHistory(){
  const el=document.getElementById('history_list');
  if(!trades.length){el.innerHTML='<div class="empty">還沒有紀錄</div>';return;}
  el.innerHTML=trades.map(t=>{
    const pnlColor=t.pnl>0?'var(--success)':t.pnl<0?'var(--danger)':'var(--text2)';
    const pnlStr=(t.pnl>0?'+':'')+t.pnl.toFixed(2)+' U';
    const dirCls=t.dir==='long'?'dir-long':'dir-short';
    const dirLabel=t.dir==='long'?'多':'空';
    const tags=[...(t.reasons||[]),t.emotion].filter(Boolean).map(r=>`<span class="tag">${r}</span>`).join('');
    const imgHtml=t.img?`<img class="trade-img" src="${t.img}" alt="圖表" onclick="openModal(trades.find(x=>x.id===${t.id})?.img||'')" />`:'';
    const noteHtml=t.note?`<div class="note-text">${t.note}</div>`:'';
    return `<div class="trade-item">
      <div class="trade-header">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="trade-symbol">${t.symbol}</span>
          <span class="dir-tag ${dirCls}">${dirLabel}</span>
          <span style="font-size:12px;color:var(--text2)">${t.date}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="trade-pnl" style="color:${pnlColor}">${pnlStr}</span>
          <button class="del-btn" onclick="deleteTrade(${t.id})">刪除</button>
        </div>
      </div>
      <div class="trade-meta">進場 ${t.entry}${t.sl?' · 止損 '+t.sl:''}${t.tp?' · 止盈 '+t.tp:''}</div>
      <div class="tags">${tags}</div>
      ${noteHtml}${imgHtml}
    </div>`;
  }).join('');
}

function renderStats(){
  const el=document.getElementById('stats_content');
  if(!trades.length){el.innerHTML='<div class="empty">還沒有紀錄</div>';return;}
  const total=trades.length;
  const wins=trades.filter(t=>t.outcome==='win').length;
  const losses=trades.filter(t=>t.outcome==='loss').length;
  const winrate=((wins/total)*100).toFixed(1);
  const totalPnl=trades.reduce((s,t)=>s+(t.pnl||0),0);
  const avgWin=wins>0?trades.filter(t=>t.pnl>0).reduce((s,t)=>s+t.pnl,0)/wins:0;
  const avgLoss=losses>0?Math.abs(trades.filter(t=>t.pnl<0).reduce((s,t)=>s+t.pnl,0)/losses):0;
  const rr=avgLoss>0?(avgWin/avgLoss).toFixed(2):'—';
  const pnlCls=totalPnl>=0?'pos':'neg';
  const wrCls=parseFloat(winrate)>=50?'pos':'neg';
  const reasonCount={};
  trades.forEach(t=>(t.reasons||[]).forEach(r=>{reasonCount[r]=(reasonCount[r]||0)+1;}));
  const topReasons=Object.entries(reasonCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const emotionCount={};
  trades.forEach(t=>{if(t.emotion)emotionCount[t.emotion]=(emotionCount[t.emotion]||0)+1;});
  const topEmotions=Object.entries(emotionCount).sort((a,b)=>b[1]-a[1]);
  el.innerHTML=`
    <p class="slabel">整體績效</p>
    <div class="stat-grid">
      <div class="stat"><div class="sl">總筆數</div><div class="sv">${total}</div></div>
      <div class="stat"><div class="sl">勝率</div><div class="sv ${wrCls}">${winrate}%</div></div>
      <div class="stat"><div class="sl">累積盈虧</div><div class="sv ${pnlCls}">${totalPnl>=0?'+':''}${totalPnl.toFixed(2)}U</div></div>
      <div class="stat"><div class="sl">平均賠率</div><div class="sv">${rr}</div></div>
      <div class="stat"><div class="sl">平均獲利</div><div class="sv pos">+${avgWin.toFixed(2)}U</div></div>
      <div class="stat"><div class="sl">平均虧損</div><div class="sv neg">-${avgLoss.toFixed(2)}U</div></div>
    </div>
    <hr class="divider" />
    <p class="slabel">最常用進場理由</p>
    ${topReasons.length?topReasons.map(([r,c])=>`
      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>${r}</span><span style="color:var(--text2)">${c} 次</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min((c/total)*100,100).toFixed(0)}%"></div></div>
      </div>`).join(''):'<p style="font-size:13px;color:var(--text2)">無資料</p>'}
    <hr class="divider" />
    <p class="slabel">情緒分佈</p>
    <div class="tags">${topEmotions.length?topEmotions.map(([e,c])=>`<span class="tag">${e} × ${c}</span>`).join(''):'<span style="font-size:13px;color:var(--text2)">無資料</span>'}</div>
  `;
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.opacity='1';
  setTimeout(()=>t.style.opacity='0',2500);
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

loadTrades();
calcUpdate();
document.getElementById('l_date').value=new Date().toISOString().split('T')[0];
</script>
</body>
</html>
